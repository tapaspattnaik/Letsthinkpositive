name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Quick CI type-check (catches errors before hitting the server) ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps (CI)
        run: npm ci --legacy-peer-deps

      - name: Prisma generate (CI)
        run: npx prisma generate

      - name: TypeScript check
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://letsthinkpositive.com
          DATABASE_URL:         mysql://placeholder:placeholder@localhost:3306/placeholder
          NEXTAUTH_SECRET:      ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL:         https://letsthinkpositive.com
        run: npx tsc --noEmit

      # ── Deploy: pull + build + restart on Hostinger ────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          timeout:  300s
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}

            echo "── Pull latest code ──"
            git pull origin main

            echo "── Install dependencies ──"
            npm install --legacy-peer-deps

            echo "── Generate Prisma client ──"
            npx prisma generate

            echo "── Build Next.js app ──"
            NODE_ENV=production npm run build

            echo "── Restart process ──"
            pm2 restart letsthinkpositive --update-env \
              || pm2 start server.js --name letsthinkpositive --update-env
            pm2 save

            echo "── Deploy complete ✓ ──"
