name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Quick CI check (catches errors before touching the server) ──────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps (CI)
        run: npm ci --legacy-peer-deps

      - name: Prisma generate (CI)
        run: npx prisma generate

      - name: TypeScript check
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://letsthinkpositive.com
          DATABASE_URL:         mysql://placeholder:placeholder@localhost:3306/placeholder
          NEXTAUTH_SECRET:      ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL:         https://letsthinkpositive.com
        run: npx tsc --noEmit

      # ── Deploy on Hostinger ─────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          timeout:  600s
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}

            echo "── [1/6] Pull latest code ──"
            git pull origin main

            echo "── [2/6] Install dependencies ──"
            # --foreground-scripts=false prevents postinstall workers spawning in bg
            npm install --legacy-peer-deps --foreground-scripts=false

            echo "── [3/6] Generate Prisma client ──"
            npx prisma generate

            echo "── [4/6] Stop app before build (frees resources during compile) ──"
            pm2 stop letsthinkpositive || true

            echo "── [5/6] Build (limited to 2 workers) ──"
            # NODE_OPTIONS caps memory; cpus:2 in next.config limits static gen workers
            NODE_ENV=production NODE_OPTIONS="--max-old-space-size=768" npm run build

            echo "── [6/6] Start / restart app ──"
            pm2 start server.js --name letsthinkpositive --update-env \
              || pm2 restart letsthinkpositive --update-env
            pm2 save

            echo "── Deploy complete ✓ ──"
